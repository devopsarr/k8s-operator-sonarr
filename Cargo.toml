[package]
name = "k8s-opeartor-sonarr"
version = "0.1.0"
edition = "2021"

[dependencies]
kube = { version = "0.84.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.18.0", features = ["v1_26"] }
tokio = { version = "1.29.1", features = ["full"] }
futures = "0.3.28"
anyhow = "1.0.72"
thiserror = "1.0.44"
serde = { version = "1.0.174", features = ["derive"] }
serde_json = "1.0.103"
serde_yaml = "0.9.25"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
chrono = { version = "0.4.26", features = ["serde"] }
async-trait = "0.1.71"
clap = { version = "4.3.19", features = ["derive"] }
schemars = "0.8.12"

[[bin]]
name = "k8s-operator-sonarr"
path = "src/main.rs"

[[bin]]
name = "generate_crd"
path = "src/bin/generate_crd.rs"