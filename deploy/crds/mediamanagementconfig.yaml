                type: boolean
              deleteEmptyFolders:
                description: Delete empty series and season folders during disk scan
                nullable: true
                type: boolean
              downloadPropersAndRepacks:
                description: 'Download propers and repacks: DoNotPrefer, PreferAndUpgrade, DoNotUpgrade'
                enum:
                - DoNotPrefer
                - PreferAndUpgrade
                - DoNotUpgrade
