                - LocalAirDate
                - UtcAirDate
                - null
                nullable: true
                type: string
              importExtraFiles:
                description: Import extra files (subtitles, etc.)
                nullable: true
                type: boolean
              minimumFreeSpaceWhenImporting:
                description: Minimum free space when importing (MB)
                format: int32
                nullable: true
                type: integer
              recycleBin:
                description: Recycle bin path (empty to disable)
                nullable: true
                type: string
              recycleBinCleanupDays:
                description: Days to keep files in recycle bin before cleaning (0 to disable)
                format: int32
                nullable: true
                type: integer
              rescanAfterRefresh:
                description: 'Rescan series folder after refresh: Always, AfterManual, Never'
                enum:
                - Always
                - AfterManual
                - Never
                - null
                nullable: true
                type: string
              scriptImportPath:
                description: Script import path
                nullable: true
                type: string
              setPermissionsLinux:
