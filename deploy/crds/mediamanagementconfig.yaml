                    description: Name of the SonarrInstance resource
                    type: string
                  namespace:
                    description: Namespace of the SonarrInstance (optional, defaults to same namespace)
                    nullable: true
                    type: string
                type: object
              useScriptImport:
                description: Use script for importing
                nullable: true
                type: boolean
            required:
            - sonarrInstanceRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Current conditions
