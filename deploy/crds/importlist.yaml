              SonarrImportList represents an import list configuration in Sonarr
              Import lists automatically add series from external sources (Trakt, Plex, etc.)
            properties:
              config:
                default:
                  accessToken: null
                  apiKey: null
                  authUser: null
                  baseUrl: null
                  languageProfileId: null
                  listId: null
                  listname: null
                  profileIds: []
                  tagIds: []
                  traktListType: null
