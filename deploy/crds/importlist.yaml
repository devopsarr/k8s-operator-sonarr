                  accessToken:
                    description: Access token (for Trakt/Plex)
                    nullable: true
                    type: string
                  apiKey:
                    description: API key (for Sonarr import)
                    nullable: true
                    type: string
                  authUser:
                    description: Auth user (for Trakt)
                    nullable: true
                    type: string
                  baseUrl:
                    description: Base URL (for Sonarr import)
                    nullable: true
                    type: string
                  languageProfileId:
                    description: Language profile ID (deprecated in v4)
                    format: int32
                    nullable: true
                    type: integer
                  listId:
                    description: List ID
                    nullable: true
                    type: string
                  listname:
                    description: List name/ID
                    nullable: true
                    type: string
                  profileIds:
                    default: []
                    description: Profile IDs (for Sonarr import)
                    items:
                      format: int32
                      type: integer
                    type: array
                  tagIds:
                    default: []
                    description: Tag IDs (for Sonarr import)
                    items:
                      format: int32
                      type: integer
                    type: array
                  traktListType:
                    description: Trakt list type
                    format: int32
                    nullable: true
                    type: integer
                  username:
                    description: Username (for various services)
                    nullable: true
                    type: string
                type: object
              enableAutomaticAdd:
                default: true
                description: Enable automatic add
                type: boolean
              listOrder:
                default: 0
                description: List order
                format: int32
                type: integer
              listType:
                description: Import list type/implementation
                enum:
                - sonarrImport
                - traktListImport
                - traktUserImport
                - traktPopularImport
                - plexImport
                - imdbListImport
                - customImport
                - simklImport
                - aniListImport
                - myAnimeListImport
                type: string
              monitorNewItems:
                default: all
                description: Monitor new items
                enum:
                - all
                - none
                type: string
              name:
                description: Import list name
                type: string
              qualityProfileId:
                description: Quality profile ID to use
                format: int32
                type: integer
              rootFolderPath:
                description: Root folder path for imported series
                type: string
              searchForMissingEpisodes:
                default: false
