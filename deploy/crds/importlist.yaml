                type: boolean
              seasonFolder:
                default: true
                description: Use season folders
                type: boolean
              seriesType:
                default: standard
                description: Series type
                enum:
                - standard
                - daily
                - anime
                type: string
              shouldMonitor:
                default: all
                description: Monitor type for imported series
                enum:
                - all
                - future
                - missing
                - existing
                - firstSeason
                - latestSeason
                - pilot
                - monitorSpecials
                - unmonitorSpecials
                - none
                type: string
              sonarrInstanceRef:
                description: Reference to the SonarrInstance
                properties:
                  name:
                    default: ''
                    description: Name of the SonarrInstance resource
                    type: string
                  namespace:
                    description: Namespace of the SonarrInstance (optional, defaults to same namespace)
                    nullable: true
                    type: string
                type: object
              tags:
                default: []
                description: Tags for imported series
                items:
                  format: int32
                  type: integer
                type: array
