# Sonarr CRD instance for E2E tests
# This creates the Sonarr custom resource that the operator will use to connect
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarr-api-key
  namespace: default
  labels:
    app: sonarr
type: Opaque
stringData:
  # This will be populated by the setup script after Sonarr starts
  # The API key is generated by Sonarr on first run
  api-key: 'placeholder-will-be-replaced'
---
apiVersion: devopsarr.io/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
  namespace: default
spec:
  # URL of the Sonarr instance
  url: http://sonarr.default.svc.cluster.local:8989
  # Reference to the secret containing the API key
  apiKeySecretRef:
    name: sonarr-api-key
    key: api-key
