apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-k8s-operator
  labels:
    app: rust-k8s-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-k8s-operator
  template:
    metadata:
      labels:
        app: rust-k8s-operator
    spec:
      serviceAccountName: rust-k8s-operator
      containers:
      - name: operator
        image: your-registry/rust-k8s-operator:latest
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rust-k8s-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rust-k8s-operator
rules:
- apiGroups: ["example.com"]
  resources: ["myresources"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["example.com"]
  resources: ["myresources/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rust-k8s-operator
subjects:
- kind: ServiceAccount
  name: rust-k8s-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: rust-k8s-operator
  apiGroup: rbac.authorization.k8s.io
