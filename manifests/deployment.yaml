apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-k8s-operator
  labels:
    app: sonarr-k8s-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr-k8s-operator
  template:
    metadata:
      labels:
        app: sonarr-k8s-operator
    spec:
      serviceAccountName: sonarr-k8s-operator
      containers:
      - name: operator
        image: k8s-operator-sonarr:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sonarr-k8s-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sonarr-k8s-operator
rules:
- apiGroups: ["devopsarr.io"]
  resources: ["sonarrs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["devopsarr.io"]
  resources: ["sonarrs/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sonarr-k8s-operator
subjects:
- kind: ServiceAccount
  name: sonarr-k8s-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: sonarr-k8s-operator
  apiGroup: rbac.authorization.k8s.io
