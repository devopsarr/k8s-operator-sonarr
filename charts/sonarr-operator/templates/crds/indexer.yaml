{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.crds.additionalLabels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  name: sonarrindexers.devopsarr.io
spec:
  group: devopsarr.io
  names:
    categories: []
    kind: SonarrIndexer
    plural: sonarrindexers
    shortNames:
    - sidx
    singular: sonarrindexer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.indexerType
      name: Type
      type: string
    - jsonPath: .status.id
      name: ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SonarrIndexerSpec via `CustomResource`
        properties:
          spec:
            description: |-
              SonarrIndexer represents an indexer configuration in Sonarr
              Indexers are sources for finding releases (Newznab, Torznab, etc.)
            properties:
              config:
                description: Indexer-specific configuration
                properties:
                  additionalParameters:
                    description: Additional parameters
                    nullable: true
                    type: string
                  animeCategories:
                    default: []
                    description: Anime categories
                    items:
                      format: int32
                      type: integer
                    type: array
                  animeStandardFormatSearch:
                    default: false
                    description: Search anime in standard format
                    type: boolean
                  apiKey:
                    description: API key (can reference a secret)
                    nullable: true
                    type: string
                  apiKeySecretRef:
                    description: API key from secret reference
                    nullable: true
                    properties:
                      key:
                        description: Key in the secret
                        type: string
                      name:
                        description: Name of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  apiPath:
                    description: 'API path (default: /api)'
                    nullable: true
                    type: string
                  baseUrl:
                    description: Base URL for the indexer
                    nullable: true
                    type: string
                  categories:
                    default: []
                    description: Categories to search
                    items:
                      format: int32
                      type: integer
                    type: array
                  cookie:
                    description: Cookie (for some indexers)
                    nullable: true
                    type: string
                  minimumSeeders:
                    description: Minimum seeders (for torrent indexers)
                    format: int32
                    nullable: true
                    type: integer
                  passkey:
                    description: Passkey (for some indexers)
                    nullable: true
                    type: string
                  passwordSecretRef:
                    description: Password secret reference (for some indexers)
                    nullable: true
                    properties:
                      key:
                        description: Key in the secret
                        type: string
                      name:
                        description: Name of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  seedRatio:
                    description: Seed ratio (for torrent indexers)
                    format: double
                    nullable: true
                    type: number
                  seedTime:
                    description: Seed time (for torrent indexers)
                    format: int32
                    nullable: true
                    type: integer
                  username:
                    description: Username (for some indexers)
                    nullable: true
                    type: string
                type: object
              downloadClientId:
                description: Download client ID to use
                format: int32
                nullable: true
                type: integer
              enableAutomaticSearch:
                default: true
                description: Enable automatic search
                type: boolean
              enableInteractiveSearch:
                default: true
                description: Enable interactive search
                type: boolean
              enableRss:
                default: true
                description: Enable RSS feeds
                type: boolean
              indexerType:
                description: Indexer type (Newznab, Torznab, etc.)
                enum:
                - newznab
                - torznab
                - fanzub
                - broadcasthenet
                - filelist
                - hdbits
                - iptorrents
                - nyaa
                - torrentrss
                - torrentleech
                type: string
              name:
                description: Indexer name
                type: string
              priority:
                default: 25
                description: Priority for this indexer
                format: int32
                type: integer
              sonarrInstanceRef:
                description: Reference to the SonarrInstance
                properties:
                  name:
                    default: ''
                    description: Name of the SonarrInstance resource
                    type: string
                  namespace:
                    description: Namespace of the SonarrInstance (optional, defaults to same namespace)
                    nullable: true
                    type: string
                type: object
              tags:
                default: []
                description: Tags for this indexer
                items:
                  format: int32
                  type: integer
                type: array
            required:
            - config
            - indexerType
            - name
            - sonarrInstanceRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Current conditions
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                description: Sonarr Indexer ID
                format: int32
                nullable: true
                type: integer
              observedGeneration:
                default: 0
                description: Observed generation
                format: int64
                type: integer
            type: object
        required:
        - spec
        title: SonarrIndexer
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
