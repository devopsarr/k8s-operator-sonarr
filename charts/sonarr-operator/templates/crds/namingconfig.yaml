{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.crds.additionalLabels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  name: sonarrnamingconfigs.devopsarr.io
spec:
  group: devopsarr.io
  names:
    categories: []
    kind: SonarrNamingConfig
    plural: sonarrnamingconfigs
    shortNames:
    - snc
    singular: sonarrnamingconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sonarrInstanceRef.name
      name: Instance
      type: string
    - jsonPath: .spec.renameEpisodes
      name: Rename
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SonarrNamingConfigSpec via `CustomResource`
        properties:
          spec:
            description: |-
              SonarrNamingConfig configures episode naming settings for a Sonarr instance.
              Only one SonarrNamingConfig per Sonarr instance is allowed.
            properties:
              animeEpisodeFormat:
                description: |-
                  Anime episode format
                  Example: "{Series Title} - S{season:00}E{episode:00} - {Episode Title} {Quality Full}"
                nullable: true
                type: string
              colonReplacementFormat:
                description: Colon replacement format (0=Delete, 1=Dash, 2=SpaceDash, 3=SpaceDashSpace, 4=Smart)
                format: int32
                nullable: true
                type: integer
              customColonReplacementFormat:
                description: Custom colon replacement format string
                nullable: true
                type: string
              dailyEpisodeFormat:
                description: |-
                  Daily episode format
                  Example: "{Series Title} - {Air-Date} - {Episode Title} {Quality Full}"
                nullable: true
                type: string
              multiEpisodeStyle:
                description: Multi-episode style (0=Extend, 1=Duplicate, 2=Repeat, 3=Scene, 4=Range, 5=PrefixedRange)
                format: int32
                nullable: true
                type: integer
              renameEpisodes:
                description: Enable episode renaming
                nullable: true
                type: boolean
              replaceIllegalCharacters:
                description: Replace illegal characters in filenames
                nullable: true
                type: boolean
              seasonFolderFormat:
                description: |-
                  Season folder format
                  Example: "Season {season}"
                nullable: true
                type: string
              seriesFolderFormat:
                description: |-
                  Series folder format
                  Example: "{Series Title}"
                nullable: true
                type: string
              sonarrInstanceRef:
                description: Reference to the Sonarr instance
                properties:
                  name:
                    default: ''
                    description: Name of the SonarrInstance resource
                    type: string
                  namespace:
                    description: Namespace of the SonarrInstance (optional, defaults to same namespace)
                    nullable: true
                    type: string
                type: object
              specialsFolderFormat:
                description: |-
                  Specials folder format
                  Example: "Specials"
                nullable: true
                type: string
              standardEpisodeFormat:
                description: |-
                  Standard episode format
                  Example: "{Series Title} - S{season:00}E{episode:00} - {Episode Title} {Quality Full}"
                nullable: true
                type: string
            required:
            - sonarrInstanceRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Current conditions
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                default: 0
                description: Observed generation
                format: int64
                type: integer
            type: object
        required:
        - spec
        title: SonarrNamingConfig
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
