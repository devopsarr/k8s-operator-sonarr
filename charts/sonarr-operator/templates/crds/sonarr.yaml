{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.crds.additionalLabels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  name: sonarrs.devopsarr.io
spec:
  group: devopsarr.io
  names:
    categories: []
    kind: Sonarr
    plural: sonarrs
    shortNames:
    - snr
    singular: sonarr
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SonarrSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Sonarr is the main CRD that deploys and manages a Sonarr instance

              This CRD creates:
              - A Deployment with the Sonarr container
              - An init container for database migrations
              - A Service to expose Sonarr
              - A PersistentVolumeClaim for configuration storage
              - Optional Ingress for external access
            properties:
              apiKeySecretRef:
                description: API key secret reference (optional - will be auto-generated if not provided)
                nullable: true
                properties:
                  key:
                    description: Key in the secret
                    type: string
                  name:
                    description: Name of the secret
                    type: string
                required:
                - key
                - name
                type: object
              config:
                default:
                  analyticsEnabled: null
                  authenticationMethod: null
                  authenticationRequired: null
                  bindAddress: null
                  initContainerImage: null
                  instanceName: null
                  logLevel: null
                  urlBase: null
                description: Sonarr application configuration (config.xml settings)
                properties:
                  analyticsEnabled:
                    description: 'Analytics enabled (default: true)'
                    nullable: true
                    type: boolean
                  authenticationMethod:
                    description: 'Authentication method: None, Basic, Forms, External (default: None)'
                    nullable: true
                    type: string
                  authenticationRequired:
                    description: 'Authentication required for API access (default: false)'
                    nullable: true
                    type: boolean
                  bindAddress:
                    description: 'Bind address (default: "*")'
                    nullable: true
                    type: string
                  initContainerImage:
                    description: 'Init container image used to configure config.xml (default: busybox:latest)'
                    nullable: true
                    type: string
                  instanceName:
                    description: Instance name displayed in the UI
                    nullable: true
                    type: string
                  logLevel:
                    description: 'Log level: trace, debug, info, warn, error (default: info)'
                    nullable: true
                    type: string
                  urlBase:
                    description: URL base for reverse proxy setups (e.g., "/sonarr")
                    nullable: true
                    type: string
                type: object
              env:
                default: []
                description: Environment variables
                items:
                  properties:
                    name:
                      description: Name of the environment variable
                      type: string
                    value:
                      description: Value of the environment variable
                      nullable: true
                      type: string
                    valueFrom:
                      description: Reference to a secret or configmap
                      nullable: true
                      properties:
                        configMapKeyRef:
                          description: ConfigMap key reference
                          nullable: true
                          properties:
                            key:
                              description: Key in the configmap
                              type: string
                            name:
                              description: Name of the configmap
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        secretKeyRef:
                          description: Secret key reference
                          nullable: true
                          properties:
                            key:
                              description: Key in the secret
                              type: string
                            name:
                              description: Name of the secret
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      type: object
                  required:
                  - name
                  type: object
                type: array
              httpRoute:
                description: HTTPRoute configuration for Gateway API (optional)
                nullable: true
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Additional annotations for the HTTPRoute
                    type: object
                  enabled:
                    default: false
                    description: 'Enable HTTPRoute creation (default: false)'
                    type: boolean
                  gatewayRef:
                    description: Gateway reference - the Gateway to attach to
                    properties:
                      name:
                        description: Name of the Gateway
                        type: string
                      namespace:
                        description: Namespace of the Gateway (optional, defaults to same namespace as HTTPRoute)
                        nullable: true
                        type: string
                      sectionName:
                        description: Section name within the Gateway (optional)
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  hostnames:
                    default: []
                    description: Hostnames for the HTTPRoute
                    items:
                      type: string
                    type: array
                  labels:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Additional labels for the HTTPRoute
                    type: object
                  path:
                    default: /
                    description: 'Path match for the route (default: /)'
                    type: string
                  pathType:
                    default: PathPrefix
                    description: 'Path match type: Exact, PathPrefix, or RegularExpression (default: PathPrefix)'
                    type: string
                required:
                - gatewayRef
                type: object
              image:
                default: lscr.io/linuxserver/sonarr:latest
                description: 'Sonarr image to use (default: lscr.io/linuxserver/sonarr:latest)'
                type: string
              imagePullPolicy:
                default: IfNotPresent
                description: 'Image pull policy (default: IfNotPresent)'
                type: string
              ingress:
                description: Ingress configuration (optional)
                nullable: true
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Ingress annotations
                    type: object
                  enabled:
                    default: false
                    description: 'Enable ingress (default: false)'
                    type: boolean
                  host:
                    description: Hostname for the ingress
                    type: string
                  ingressClassName:
                    description: Ingress class name
                    nullable: true
                    type: string
                  path:
                    default: /
                    description: 'Path for the ingress (default: /)'
                    type: string
                  pathType:
                    default: Prefix
                    description: 'Path type (default: Prefix)'
                    type: string
                  tls:
                    description: TLS configuration
                    nullable: true
                    properties:
                      hosts:
                        default: []
                        description: Hosts covered by the TLS certificate
                        items:
                          type: string
                        type: array
                      secretName:
                        description: Secret name containing TLS certificate
                        type: string
                    required:
                    - secretName
                    type: object
                required:
                - host
                type: object
              initContainer:
                description: Init container configuration (for custom init logic)
                nullable: true
                properties:
                  args:
                    default: []
                    description: Arguments for the command
                    items:
                      type: string
                    type: array
                  command:
                    default: []
                    description: Command to run in init container
                    items:
                      type: string
                    type: array
                  env:
                    default: []
                    description: Environment variables for init container
                    items:
                      properties:
                        name:
                          description: Name of the environment variable
                          type: string
                        value:
                          description: Value of the environment variable
                          nullable: true
                          type: string
                        valueFrom:
                          description: Reference to a secret or configmap
                          nullable: true
                          properties:
                            configMapKeyRef:
                              description: ConfigMap key reference
                              nullable: true
                              properties:
                                key:
                                  description: Key in the configmap
                                  type: string
                                name:
                                  description: Name of the configmap
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            secretKeyRef:
                              description: Secret key reference
                              nullable: true
                              properties:
                                key:
                                  description: Key in the secret
                                  type: string
                                name:
                                  description: Name of the secret
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  image:
                    default: busybox:latest
                    description: 'Image for init container (default: busybox:latest)'
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                default: {}
                description: Node selector
                type: object
              replicas:
                default: 1
                description: Number of replicas (should be 1 for Sonarr)
                format: int32
                type: integer
              resources:
                description: Resource requirements
                nullable: true
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Resource limits
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Resource requests
                    type: object
                type: object
              securityContext:
                description: Pod security context
                nullable: true
                properties:
                  fsGroup:
                    format: int64
                    nullable: true
                    type: integer
                  runAsGroup:
                    format: int64
                    nullable: true
                    type: integer
                  runAsNonRoot:
                    nullable: true
                    type: boolean
                  runAsUser:
                    format: int64
                    nullable: true
                    type: integer
                type: object
              service:
                default:
                  annotations: {}
                  containerPort: 0
                  nodePort: null
                  port: 0
                  serviceType: ''
                description: Service configuration
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Service annotations
                    type: object
                  containerPort:
                    default: 8989
                    description: 'Container port - the port Sonarr listens on inside the container (default: 8989)'
                    format: int32
                    type: integer
                  nodePort:
                    description: Node port (only for NodePort type)
                    format: int32
                    nullable: true
                    type: integer
                  port:
                    default: 8989
                    description: 'Service port (default: 8989)'
                    format: int32
                    type: integer
                  serviceType:
                    default: ClusterIP
                    description: 'Service type (default: ClusterIP)'
                    type: string
                type: object
              storage:
                default:
                  accessModes: []
                  existingClaim: null
                  size: ''
                  storageClass: null
                description: Storage configuration
                properties:
                  accessModes:
                    default:
                    - ReadWriteOnce
                    description: 'Access modes (default: ReadWriteOnce)'
                    items:
                      type: string
                    type: array
                  existingClaim:
                    description: Existing PVC to use (optional)
                    nullable: true
                    type: string
                  size:
                    default: 1Gi
                    description: 'Size of the config PVC (default: 1Gi)'
                    type: string
                  storageClass:
                    description: Storage class for the PVC
                    nullable: true
                    type: string
                type: object
              tolerations:
                default: []
                description: Tolerations
                items:
                  properties:
                    effect:
                      nullable: true
                      type: string
                    key:
                      nullable: true
                      type: string
                    operator:
                      nullable: true
                      type: string
                    tolerationSeconds:
                      format: int64
                      nullable: true
                      type: integer
                    value:
                      nullable: true
                      type: string
                  type: object
                type: array
              volumeMounts:
                default: []
                description: Volume mounts for media directories
                items:
                  properties:
                    mountPath:
                      description: Mount path inside the container
                      type: string
                    name:
                      description: Name of the volume
                      type: string
                    readOnly:
                      default: false
                      description: Read only flag
                      type: boolean
                    subPath:
                      description: Sub path (optional)
                      nullable: true
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
              volumes:
                default: []
                description: Additional volumes
                items:
                  properties:
                    configMap:
                      description: ConfigMap volume
                      nullable: true
                      properties:
                        items:
                          default: []
                          items:
                            properties:
                              key:
                                type: string
                              path:
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    emptyDir:
                      description: Empty dir volume
                      nullable: true
                      properties:
                        medium:
                          nullable: true
                          type: string
                        sizeLimit:
                          nullable: true
                          type: string
                      type: object
                    hostPath:
                      description: HostPath volume
                      nullable: true
                      properties:
                        path:
                          type: string
                        type:
                          nullable: true
                          type: string
                      required:
                      - path
                      type: object
                    name:
                      description: Name of the volume
                      type: string
                    nfs:
                      description: NFS volume
                      nullable: true
                      properties:
                        path:
                          type: string
                        readOnly:
                          default: false
                          type: boolean
                        server:
                          type: string
                      required:
                      - path
                      - server
                      type: object
                    persistentVolumeClaim:
                      description: PVC claim
                      nullable: true
                      properties:
                        claimName:
                          type: string
                        readOnly:
                          default: false
                          type: boolean
                      required:
                      - claimName
                      type: object
                  required:
                  - name
                  type: object
                type: array
            type: object
          status:
            nullable: true
            properties:
              apiKeySecret:
                description: API key (stored in secret)
                nullable: true
                type: string
              conditions:
                default: []
                description: Current conditions
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                default: 0
                description: Observed generation
                format: int64
                type: integer
              readyReplicas:
                default: 0
                description: Number of ready replicas
                format: int32
                type: integer
              url:
                description: URL to access Sonarr
                nullable: true
                type: string
              version:
                description: Sonarr version
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Sonarr
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
