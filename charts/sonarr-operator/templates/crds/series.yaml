{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.crds.additionalLabels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  name: sonarrseries.devopsarr.io
spec:
  group: devopsarr.io
  names:
    categories: []
    kind: SonarrSeries
    plural: sonarrseries
    shortNames:
    - ss
    singular: sonarrseries
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.tvdbId
      name: TVDB ID
      type: integer
    - jsonPath: .spec.monitored
      name: Monitored
      type: boolean
    - jsonPath: .status.id
      name: ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SonarrSeriesSpec via `CustomResource`
        properties:
          spec:
            description: |-
              SonarrSeries represents a TV series managed in Sonarr
              This allows declarative management of series in your library
            properties:
              addOptions:
                default:
                  monitor: all
                  searchForCutoffUnmetEpisodes: false
                  searchForMissingEpisodes: true
                description: Monitor type for adding series
                properties:
                  monitor:
                    default: all
                    description: Monitor type
                    enum:
                    - all
                    - future
                    - missing
                    - existing
                    - recent
                    - pilot
                    - firstseason
                    - lastseason
                    - none
                    type: string
                  searchForCutoffUnmetEpisodes:
                    default: false
                    description: Search for cutoff unmet episodes
                    type: boolean
                  searchForMissingEpisodes:
                    default: true
                    description: Search for missing episodes when adding
                    type: boolean
                type: object
              monitored:
                default: true
                description: Whether the series is monitored
                type: boolean
              path:
                description: Specific path override (optional)
                nullable: true
                type: string
              qualityProfile:
                description: Quality profile ID or name reference
                properties:
                  id:
                    description: Quality profile ID
                    format: int32
                    nullable: true
                    type: integer
                  name:
                    description: Quality profile name (will be resolved to ID)
                    nullable: true
                    type: string
                type: object
              rootFolderPath:
                description: Root folder path for the series
                type: string
              seasonFolder:
                default: true
                description: Use season folders
                type: boolean
              seriesType:
                default: standard
                description: Series type
                enum:
                - standard
                - daily
                - anime
                type: string
              sonarrInstanceRef:
                description: Reference to the SonarrInstance
                properties:
                  name:
                    default: ''
                    description: Name of the SonarrInstance resource
                    type: string
                  namespace:
                    description: Namespace of the SonarrInstance (optional, defaults to same namespace)
                    nullable: true
                    type: string
                type: object
              tags:
                default: []
                description: Tags for this series
                items:
                  format: int32
                  type: integer
                type: array
              title:
                description: Series title
                type: string
              titleSlug:
                description: Title slug (kebab-case version of title)
                type: string
              tvdbId:
                description: TVDB ID for the series
                format: int32
                type: integer
              useSceneNumbering:
                default: false
                description: Use scene numbering
                type: boolean
            required:
            - qualityProfile
            - rootFolderPath
            - sonarrInstanceRef
            - title
            - titleSlug
            - tvdbId
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Current conditions
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              episodeCount:
                description: Total episode count
                format: int32
                nullable: true
                type: integer
              episodeFileCount:
                description: Episode file count
                format: int32
                nullable: true
                type: integer
              id:
                description: Sonarr Series ID
                format: int32
                nullable: true
                type: integer
              network:
                description: Network
                nullable: true
                type: string
              nextAiring:
                description: Next airing date
                nullable: true
                type: string
              observedGeneration:
                default: 0
                description: Observed generation
                format: int64
                type: integer
              percentComplete:
                description: Percentage complete
                format: double
                nullable: true
                type: number
              previousAiring:
                description: Previous airing date
                nullable: true
                type: string
              seriesStatus:
                description: Status (continuing, ended, etc.)
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: SonarrSeries
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
