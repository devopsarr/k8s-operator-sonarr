{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if or .Values.crds.keep .Values.crds.annotations }}
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.crds.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.crds.additionalLabels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  name: sonarrmetadatas.devopsarr.io
spec:
  group: devopsarr.io
  names:
    categories: []
    kind: SonarrMetadata
    plural: sonarrmetadatas
    shortNames:
    - smeta
    singular: sonarrmetadata
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.metadataType
      name: Type
      type: string
    - jsonPath: .spec.enable
      name: Enabled
      type: boolean
    - jsonPath: .status.id
      name: ID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SonarrMetadataSpec via `CustomResource`
        properties:
          spec:
            description: |-
              SonarrMetadata represents a metadata consumer configuration in Sonarr
              Metadata consumers write metadata files for media managers (Kodi, Plex, etc.)
            properties:
              config:
                default:
                  episodeImages: false
                  episodeMetadata: false
                  seasonImages: false
                  seriesImages: false
                  seriesMetadata: false
                  seriesMetadataUrl: false
                description: Metadata-specific configuration
                properties:
                  episodeImages:
                    default: false
                    description: Write episode images (thumbnails)
                    type: boolean
                  episodeMetadata:
                    default: true
                    description: Write episode metadata (episode.nfo)
                    type: boolean
                  seasonImages:
                    default: true
                    description: Write season images
                    type: boolean
                  seriesImages:
                    default: true
                    description: Write series images (poster, banner, fanart)
                    type: boolean
                  seriesMetadata:
                    default: true
                    description: Write series metadata (series.nfo)
                    type: boolean
                  seriesMetadataUrl:
                    default: false
                    description: Write series metadata URL (deprecated)
                    type: boolean
                type: object
              enable:
                default: true
                description: Enable this metadata consumer
                type: boolean
              metadataType:
                description: Metadata type/implementation
                enum:
                - xbmcMetadata
                - roksboxMetadata
                - wdtvMetadata
                type: string
              name:
                description: Metadata consumer name
                type: string
              sonarrInstanceRef:
                description: Reference to the SonarrInstance
                properties:
                  name:
                    default: ''
                    description: Name of the SonarrInstance resource
                    type: string
                  namespace:
                    description: Namespace of the SonarrInstance (optional, defaults to same namespace)
                    nullable: true
                    type: string
                type: object
              tags:
                default: []
                description: Tags for this metadata consumer
                items:
                  format: int32
                  type: integer
                type: array
            required:
            - metadataType
            - name
            - sonarrInstanceRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Current conditions
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                description: Sonarr Metadata ID
                format: int32
                nullable: true
                type: integer
              observedGeneration:
                default: 0
                description: Observed generation
                format: int64
                type: integer
            type: object
        required:
        - spec
        title: SonarrMetadata
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
