  - https://github.com/devopsarr/k8s-operator-sonarr
maintainers:
  - name: DevOpsArr
    url: https://github.com/devopsarr
keywords:
  - sonarr
  - operator
  - kubernetes
  - kube-rs
  - media
  - arr
annotations:
  artifacthub.io/category: integration-delivery
