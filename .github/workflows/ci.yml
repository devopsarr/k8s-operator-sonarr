name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    # ============================================
    # Lint and Format Check
    # ============================================
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - name: Check formatting
              run: cargo fmt -- --check
            - name: Clippy
              run: cargo clippy -- -D warnings

    # ============================================
    # Unit Tests
    # ============================================
    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Run unit tests
              run: cargo test --lib

    # ============================================
    # Build
    # ============================================
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Build
              run: cargo build --release
            - name: Generate CRDs
              run: cargo run --bin crdgen -- --split deploy/crds
            - name: Upload CRDs artifact
              uses: actions/upload-artifact@v4
              with:
                  name: crds
                  path: deploy/crds/

    # ============================================
    # Generate CRD Documentation
    # ============================================
    docs:
        name: Generate Docs
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22'

            - name: Install crdoc
              run: go install fybrik.io/crdoc@latest

            - name: Generate CRDs
              run: cargo run --bin crdgen -- --split deploy/crds

            - name: Generate CRD documentation
              run: |
                  mkdir -p docs/api
                  crdoc --resources deploy/crds --output docs/api/crd-reference.md

            - name: Upload documentation artifact
              uses: actions/upload-artifact@v4
              with:
                  name: docs
                  path: docs/api/

    # ============================================
    # Integration Tests (CRD validation)
    # ============================================
    integration-test:
        name: Integration Tests (K8s ${{ matrix.k8s }})
        runs-on: ubuntu-latest
        needs: [lint, test, build]
        strategy:
            fail-fast: false
            matrix:
                k8s: [v1.28, v1.29, latest]
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2

            - name: Set up k3d cluster
              uses: nolar/setup-k3d-k3s@v1
              with:
                  version: ${{ matrix.k8s }}
                  k3d-name: sonarr-operator-test
                  k3d-args: '--no-lb --no-rollback --k3s-arg --disable=traefik,servicelb,metrics-server@server:*'

            - name: Generate and install CRDs
              run: |
                  cargo run --bin crdgen -- --split deploy/crds
                  kubectl apply -f deploy/crds/

            - name: Wait for CRDs
              run: |
                  kubectl wait --for=condition=established crd/sonarrs.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrtags.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrrootfolders.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrindexers.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrdownloadclients.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrnotifications.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrqualityprofiles.devopsarr.io --timeout=60s
                  kubectl wait --for=condition=established crd/sonarrseries.devopsarr.io --timeout=60s

            - name: Run integration tests
              run: cargo test --test integration -- --ignored --test-threads=1

            - name: Cleanup
              if: always()
              run: kubectl delete namespace sonarr-operator-test --ignore-not-found

    # ============================================
    # E2E Tests (Full reconciliation with Sonarr)
    # ============================================
    e2e-test:
        name: E2E Tests
        runs-on: ubuntu-latest
        needs: [integration-test]
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2

            - name: Set up k3d cluster
              uses: nolar/setup-k3d-k3s@v1
              with:
                  version: latest
                  k3d-name: sonarr-operator-e2e
                  k3d-args: '--no-lb --no-rollback --k3s-arg --disable=traefik,servicelb,metrics-server@server:*'

            - name: Generate and install CRDs
              run: |
                  cargo run --bin crdgen -- --split deploy/crds
                  kubectl apply -f deploy/crds/

            - name: Deploy Sonarr
              run: |
                  kubectl apply -f tests/e2e/fixtures/sonarr-deployment.yaml
                  echo "Waiting for Sonarr deployment..."
                  kubectl wait --for=condition=available deployment/sonarr -n default --timeout=300s
                  echo "Waiting for Sonarr pod..."
                  kubectl wait --for=condition=ready pod -l app=sonarr -n default --timeout=300s
                  echo "Giving Sonarr time to initialize..."
                  sleep 60

            - name: Extract Sonarr API key
              id: sonarr-key
              run: |
                  SONARR_POD=$(kubectl get pod -l app=sonarr -n default -o jsonpath='{.items[0].metadata.name}')
                  for i in {1..20}; do
                    API_KEY=$(kubectl exec "${SONARR_POD}" -n default -- cat /config/config.xml 2>/dev/null | grep -oP '(?<=<ApiKey>)[^<]+' || true)
                    if [ -n "${API_KEY}" ]; then
                      echo "API key extracted"
                      echo "api_key=${API_KEY}" >> $GITHUB_OUTPUT
                      break
                    fi
                    echo "Waiting for API key... (attempt $i/20)"
                    sleep 10
                  done
                  if [ -z "${API_KEY}" ]; then
                    echo "Failed to extract API key"
                    kubectl logs "${SONARR_POD}" -n default --tail=100
                    exit 1
                  fi

            - name: Create Sonarr instance
              run: |
                  kubectl create secret generic sonarr-api-key \
                    --from-literal=api-key="${{ steps.sonarr-key.outputs.api_key }}" \
                    -n default
                  kubectl apply -f tests/e2e/fixtures/sonarr-instance.yaml

            - name: Start operator in background
              run: |
                  cargo build --release
                  RUST_LOG=info ./target/release/sonarr-operator &
                  echo $! > /tmp/operator.pid
                  sleep 10

            - name: Setup port-forward
              run: |
                  kubectl port-forward svc/sonarr 8989:8989 -n default &
                  echo $! > /tmp/port-forward.pid
                  sleep 5

            - name: Run E2E tests
              env:
                  SONARR_API_KEY: ${{ steps.sonarr-key.outputs.api_key }}
                  SONARR_URL: http://localhost:8989
              run: cargo test --test e2e -- --ignored --test-threads=1 --nocapture

            - name: Cleanup
              if: always()
              run: |
                  if [ -f /tmp/operator.pid ]; then
                    kill $(cat /tmp/operator.pid) 2>/dev/null || true
                  fi
                  if [ -f /tmp/port-forward.pid ]; then
                    kill $(cat /tmp/port-forward.pid) 2>/dev/null || true
                  fi

            - name: Collect logs on failure
              if: failure()
              run: |
                  echo "=== Operator logs ==="
                  kubectl logs -l app=sonarr-operator -n sonarr-operator-system --tail=100 2>/dev/null || echo "No operator logs"
                  echo "=== Sonarr logs ==="
                  kubectl logs -l app=sonarr -n default --tail=100 2>/dev/null || echo "No Sonarr logs"
                  echo "=== All resources ==="
                  kubectl get all -A
                  echo "=== CRDs ==="
                  kubectl get sonarrs,sonarrtags,sonarrrootfolders -A 2>/dev/null || true

    # ============================================
    # Docker Build
    # ============================================
    docker:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: [lint, test, build]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: sonarr-operator:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
