name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # ============================================
    # Release Please - Version Management
    # ============================================
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - name: DevOpsArrBOT token
              id: DevOpsArrBOT
              uses: getsentry/action-github-app-token@v3
              with:
                  app_id: '305652'
                  private_key: ${{ secrets.DEVOPSARRBOT_PRIVATE_KEY }}

            - name: Set DevOpsArrBOT config
              run: |
                  git config --global user.name "devopsarr[bot]"
                  git config --global user.email "127950054+devopsarr[bot]@users.noreply.github.com"

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ steps.DevOpsArrBOT.outputs.token }}

            - name: Release Please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ steps.DevOpsArrBOT.outputs.token }}

    # ============================================
    # Build and Push Multi-arch Image on Release
    # ============================================
    build-and-push:
        name: Build & Push Multi-arch Image
        runs-on: ubuntu-latest
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern=v{{version}},value=${{ needs.release-please.outputs.version }}
                      type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
                      type=semver,pattern=v{{major}},value=${{ needs.release-please.outputs.version }}
                      type=raw,value=latest

            - name: Build and push multi-arch Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ============================================
    # Generate and Publish Docs & CRDs on Release
    # ============================================
    publish-docs:
        name: Publish Docs & CRDs
        runs-on: ubuntu-latest
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        permissions:
            contents: write
        steps:
            - name: DevOpsArrBOT token
              id: DevOpsArrBOT
              uses: getsentry/action-github-app-token@v3
              with:
                  app_id: '305652'
                  private_key: ${{ secrets.DEVOPSARRBOT_PRIVATE_KEY }}

            - uses: actions/checkout@v4
              with:
                  ref: main
                  token: ${{ steps.DevOpsArrBOT.outputs.token }}

            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22'

            - name: Generate CRDs
              run: |
                  mkdir -p deploy/crds
                  rm -f deploy/crds/*.yaml
                  cargo run --bin crdgen -- --split deploy/crds

            - name: Generate documentation
              run: |
                  go install fybrik.io/crdoc@latest
                  mkdir -p docs/api
                  crdoc --resources deploy/crds --output docs/api/crd-reference.md

            - name: Commit and push docs
              run: |
                  git config user.name "devopsarr[bot]"
                  git config user.email "127950054+devopsarr[bot]@users.noreply.github.com"
                  git add deploy/crds/ docs/api/
                  if git diff --cached --quiet; then
                    echo "No documentation changes to commit"
                  else
                    git commit -m "docs: update CRDs and documentation for ${{ needs.release-please.outputs.tag_name }}"
                    git push
                  fi

            - name: Attach CRDs to release
              env:
                  GITHUB_TOKEN: ${{ steps.DevOpsArrBOT.outputs.token }}
              run: |
                  tar czf crds.tar.gz -C deploy/crds .
                  gh release upload ${{ needs.release-please.outputs.tag_name }} crds.tar.gz
